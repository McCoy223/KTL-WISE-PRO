<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Suite - GradeWise Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .test-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            background: var(--paper);
            min-height: 100vh;
        }

        .test-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .test-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 36px;
            color: var(--ink);
            margin-bottom: 10px;
        }

        .test-controls {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .test-status {
            background: white;
            border: 1px solid var(--rule);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            text-align: center;
        }

        .status-running {
            border-color: var(--gold);
            background: rgba(201, 146, 42, 0.05);
        }

        .status-complete {
            border-color: var(--emerald);
            background: rgba(26, 107, 74, 0.05);
        }

        .test-results {
            background: white;
            border: 1px solid var(--rule);
            border-radius: 8px;
            overflow: hidden;
        }

        .test-item {
            padding: 16px 20px;
            border-bottom: 1px solid var(--rule);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .test-item:last-child {
            border-bottom: none;
        }

        .test-status-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            font-size: 12px;
        }

        .test-status-icon.pass {
            background: var(--emerald);
        }

        .test-status-icon.fail {
            background: var(--crimson);
        }

        .test-status-icon.running {
            background: var(--gold);
        }

        .test-details {
            flex: 1;
        }

        .test-name {
            font-weight: 600;
            color: var(--ink);
            margin-bottom: 4px;
        }

        .test-duration {
            font-size: 12px;
            color: var(--muted);
        }

        .test-error {
            font-family: 'DM Mono', monospace;
            font-size: 12px;
            color: var(--crimson);
            background: rgba(211, 47, 47, 0.05);
            padding: 8px;
            border-radius: 4px;
            margin-top: 8px;
        }

        .test-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .summary-card {
            background: white;
            border: 1px solid var(--rule);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }

        .summary-number {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .summary-label {
            font-size: 14px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .summary-number.success {
            color: var(--emerald);
        }

        .summary-number.error {
            color: var(--crimson);
        }

        .console-output {
            background: #1e1e1e;
            color: #d4d4d4;
            font-family: 'DM Mono', monospace;
            font-size: 12px;
            padding: 20px;
            border-radius: 8px;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 20px;
        }

        .console-log {
            margin-bottom: 4px;
        }

        .console-error {
            color: #f48771;
        }

        .console-success {
            color: #4ec9b0;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <div class="test-header">
            <h1>🧪 GradeWise Pro Test Suite</h1>
            <p style="color: var(--muted);">Automated testing for application functionality</p>
        </div>

        <div class="test-controls">
            <button class="btn btn-primary" onclick="runTests()">▶️ Run All Tests</button>
            <button class="btn btn-outline" onclick="clearResults()">🗑️ Clear Results</button>
            <button class="btn btn-outline" onclick="exportResults()">📥 Export Report</button>
        </div>

        <div class="test-status" id="test-status">
            <h3>Ready to run tests</h3>
            <p style="color: var(--muted);">Click "Run All Tests" to begin testing</p>
        </div>

        <div class="test-summary" id="test-summary" style="display: none;">
            <div class="summary-card">
                <div class="summary-number" id="total-tests">0</div>
                <div class="summary-label">Total Tests</div>
            </div>
            <div class="summary-card">
                <div class="summary-number success" id="passed-tests">0</div>
                <div class="summary-label">Passed</div>
            </div>
            <div class="summary-card">
                <div class="summary-number error" id="failed-tests">0</div>
                <div class="summary-label">Failed</div>
            </div>
            <div class="summary-card">
                <div class="summary-number" id="success-rate">0%</div>
                <div class="summary-label">Success Rate</div>
            </div>
        </div>

        <div class="test-results" id="test-results" style="display: none;">
            <!-- Test results will be populated here -->
        </div>

        <div class="console-output" id="console-output" style="display: none;">
            <!-- Console output will be populated here -->
        </div>
    </div>

    <script src="test-suite.js"></script>
    <script>
        let testResults = [];

        // Override console.log to capture output
        const originalConsoleLog = console.log;
        const originalConsoleError = console.error;
        
        console.log = function(...args) {
            originalConsoleLog.apply(console, args);
            addConsoleMessage(args.join(' '), 'log');
        };
        
        console.error = function(...args) {
            originalConsoleError.apply(console, args);
            addConsoleMessage(args.join(' '), 'error');
        };

        function addConsoleMessage(message, type = 'log') {
            const consoleOutput = document.getElementById('console-output');
            const messageDiv = document.createElement('div');
            messageDiv.className = `console-log console-${type === 'error' ? 'error' : 'success'}`;
            messageDiv.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            consoleOutput.appendChild(messageDiv);
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
        }

        async function runTests() {
            const statusDiv = document.getElementById('test-status');
            const resultsDiv = document.getElementById('test-results');
            const summaryDiv = document.getElementById('test-summary');
            const consoleDiv = document.getElementById('console-output');

            // Reset UI
            statusDiv.className = 'test-status status-running';
            statusDiv.innerHTML = '<h3>🔄 Running Tests...</h3><p>Please wait while tests execute</p>';
            resultsDiv.style.display = 'none';
            summaryDiv.style.display = 'none';
            consoleDiv.style.display = 'block';
            consoleDiv.innerHTML = '';

            // Clear previous results
            testResults = [];

            // Run tests
            try {
                testResults = await testSuite.runAll();
                
                // Display results
                displayResults(testResults);
                
                // Update status
                statusDiv.className = 'test-status status-complete';
                const passedCount = testResults.filter(r => r.status === 'PASS').length;
                const failedCount = testResults.filter(r => r.status === 'FAIL').length;
                statusDiv.innerHTML = `
                    <h3>✅ Tests Complete</h3>
                    <p>${passedCount} passed, ${failedCount} failed</p>
                `;
                
            } catch (error) {
                statusDiv.className = 'test-status';
                statusDiv.innerHTML = `<h3>❌ Test Error</h3><p>${error.message}</p>`;
                console.error('Test suite error:', error);
            }
        }

        function displayResults(results) {
            const resultsDiv = document.getElementById('test-results');
            const summaryDiv = document.getElementById('test-summary');
            
            // Update summary
            const totalTests = results.length;
            const passedTests = results.filter(r => r.status === 'PASS').length;
            const failedTests = results.filter(r => r.status === 'FAIL').length;
            const successRate = ((passedTests / totalTests) * 100).toFixed(1);

            document.getElementById('total-tests').textContent = totalTests;
            document.getElementById('passed-tests').textContent = passedTests;
            document.getElementById('failed-tests').textContent = failedTests;
            document.getElementById('success-rate').textContent = `${successRate}%`;

            // Display individual test results
            resultsDiv.innerHTML = results.map(test => `
                <div class="test-item">
                    <div class="test-status-icon ${test.status.toLowerCase()}">
                        ${test.status === 'PASS' ? '✓' : test.status === 'FAIL' ? '✗' : '⏳'}
                    </div>
                    <div class="test-details">
                        <div class="test-name">${test.name}</div>
                        <div class="test-duration">${test.duration}ms</div>
                        ${test.error ? `<div class="test-error">${test.error}</div>` : ''}
                    </div>
                </div>
            `).join('');

            // Show results sections
            resultsDiv.style.display = 'block';
            summaryDiv.style.display = 'grid';
        }

        function clearResults() {
            const resultsDiv = document.getElementById('test-results');
            const summaryDiv = document.getElementById('test-summary');
            const consoleDiv = document.getElementById('console-output');
            const statusDiv = document.getElementById('test-status');

            resultsDiv.style.display = 'none';
            summaryDiv.style.display = 'none';
            consoleDiv.style.display = 'none';
            statusDiv.className = 'test-status';
            statusDiv.innerHTML = '<h3>Ready to run tests</h3><p>Click "Run All Tests" to begin testing</p>';
            
            testResults = [];
        }

        function exportResults() {
            if (testResults.length === 0) {
                alert('No test results to export. Please run tests first.');
                return;
            }

            const reportData = {
                timestamp: new Date().toISOString(),
                summary: {
                    total: testResults.length,
                    passed: testResults.filter(r => r.status === 'PASS').length,
                    failed: testResults.filter(r => r.status === 'FAIL').length,
                    successRate: ((testResults.filter(r => r.status === 'PASS').length / testResults.length) * 100).toFixed(1)
                },
                results: testResults
            };

            const blob = new Blob([JSON.stringify(reportData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `test-report-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // Add validation helper function for tests
        function validateInput(data, rules) {
            const errors = [];
            
            if (rules.required && !data) {
                errors.push(`${rules.field || 'Field'} is required`);
            }
            
            if (rules.type && data && typeof data !== rules.type) {
                errors.push(`${rules.field || 'Field'} must be of type ${rules.type}`);
            }
            
            if (rules.min && data && data.length < rules.min) {
                errors.push(`${rules.field || 'Field'} must be at least ${rules.min} characters`);
            }
            
            if (rules.max && data && data.length > rules.max) {
                errors.push(`${rules.field || 'Field'} must not exceed ${rules.max} characters`);
            }
            
            if (rules.pattern && data && !rules.pattern.test(data)) {
                errors.push(`${rules.field || 'Field'} format is invalid`);
            }
            
            return errors;
        }
    </script>
</body>
</html>
