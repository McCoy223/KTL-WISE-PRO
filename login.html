<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GradeWise Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .login-container {
            min-height: 100vh;
            background: linear-gradient(135deg, var(--gold) 0%, #c9a040 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'DM Sans', sans-serif;
        }

        .login-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            padding: 40px;
            position: relative;
            overflow: hidden;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-logo {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 8px;
        }

        .login-subtitle {
            color: var(--muted);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--ink);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--rule);
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.15s;
            background: var(--paper);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--gold);
            background: white;
        }

        .form-group input.error {
            border-color: var(--crimson);
        }

        .error-message {
            color: var(--crimson);
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .login-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--ink);
        }

        .remember-me input {
            width: auto;
            margin: 0;
        }

        .forgot-password {
            font-size: 13px;
            color: var(--gold);
            text-decoration: none;
            transition: opacity 0.15s;
        }

        .forgot-password:hover {
            opacity: 0.8;
        }

        .login-button {
            width: 100%;
            padding: 14px;
            background: var(--gold);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            margin-bottom: 20px;
        }

        .login-button:hover {
            background: #b8941a;
            transform: translateY(-1px);
        }

        .login-button:disabled {
            background: var(--muted);
            cursor: not-allowed;
            transform: none;
        }

        .divider {
            text-align: center;
            margin: 24px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: var(--rule);
        }

        .divider span {
            background: white;
            padding: 0 16px;
            color: var(--muted);
            font-size: 12px;
            position: relative;
        }

        .google-login {
            width: 100%;
            padding: 12px;
            background: white;
            color: var(--ink);
            border: 2px solid var(--rule);
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .google-login:hover {
            background: var(--paper);
            border-color: var(--gold);
        }

        .google-icon {
            width: 18px;
            height: 18px;
        }

        .login-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: var(--muted);
        }

        .login-footer a {
            color: var(--gold);
            text-decoration: none;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }

        .status-message {
            padding: 12px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 16px;
            display: none;
        }

        .status-message.error {
            background: rgba(211, 47, 47, 0.1);
            color: var(--crimson);
            border: 1px solid rgba(211, 47, 47, 0.2);
            display: block;
        }

        .status-message.success {
            background: rgba(45, 184, 68, 0.1);
            color: var(--emerald);
            border: 1px solid rgba(45, 184, 68, 0.2);
            display: block;
        }

        .loading-spinner {
            display: none;
            width: 16px;
            height: 16px;
            border: 2px solid var(--muted);
            border-top: 2px solid var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .login-button.loading .button-text {
            display: none;
        }

        .login-button.loading .loading-spinner {
            display: block;
        }

        .version-info {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            color: rgba(255, 255, 255, 0.7);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">GradeWise Pro</div>
                <div class="login-subtitle">AI-Powered Student Management</div>
            </div>

            <div class="status-message" id="status-message"></div>

            <form id="login-form">
                <div class="form-group">
                    <label for="username">Email</label>
                    <input type="email" id="username" name="username" placeholder="Enter your email" required>
                    <div class="error-message" id="username-error"></div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    <div class="error-message" id="password-error"></div>
                </div>

                <div class="login-options">
                    <div class="remember-me">
                        <input type="checkbox" id="remember-me" name="remember-me">
                        <label for="remember-me">Remember me</label>
                    </div>
                    <a href="#" class="forgot-password">Forgot password?</a>
                </div>

                <button type="submit" class="login-button" id="login-button">
                    <span class="button-text">Sign In</span>
                    <div class="loading-spinner"></div>
                </button>
            </form>

            <div class="divider">
                <span>OR</span>
            </div>

            <button class="google-login" id="google-login">
                <svg class="google-icon" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Continue with Google
            </button>

            <div class="login-footer">
                Don't have an account? <a href="#">Contact Administrator</a>
            </div>
        </div>

        <div class="version-info">Version 2.0.0</div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.16.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.16.0/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="auth.js"></script>
    <script>
        // Check if user is already logged in
        window.addEventListener('DOMContentLoaded', () => {
            // Initialize auth manager if not already initialized
            if (!window.authManager) {
                console.error('Auth manager not loaded');
                return;
            }

            // Check for existing session
            if (window.authManager.isSessionValid()) {
                // User is already logged in, redirect to main app
                window.location.href = 'gradewise-pro.html';
                return;
            }

            // Check for remembered credentials
            const rememberedUser = localStorage.getItem('gw_remembered_user');
            if (rememberedUser) {
                try {
                    const userData = JSON.parse(rememberedUser);
                    document.getElementById('username').value = userData.username;
                    document.getElementById('remember-me').checked = true;
                } catch (e) {
                    localStorage.removeItem('gw_remembered_user');
                }
            }

            // Setup form handlers
            setupLoginForm();
            setupGoogleLogin();
        });

        function setupLoginForm() {
            const loginForm = document.getElementById('login-form');
            const loginButton = document.getElementById('login-button');
            const statusMessage = document.getElementById('status-message');

            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value;
                const rememberMe = document.getElementById('remember-me').checked;

                // Clear previous errors
                clearErrors();
                hideStatusMessage();

                // Validate inputs
                let hasError = false;
                
                if (!username) {
                    showError('username', 'Username is required');
                    hasError = true;
                }

                if (!password) {
                    showError('password', 'Password is required');
                    hasError = true;
                }

                if (hasError) return;

                // Show loading state
                loginButton.classList.add('loading');
                loginButton.disabled = true;

                try {
                    // Attempt authentication
                    const result = await window.authManager.authenticateUser(username, password, rememberMe);
                    
                    if (result.success) {
                        showStatusMessage('Login successful! Redirecting...', 'success');
                        
                        // Store remembered user if requested
                        if (rememberMe) {
                            localStorage.setItem('gw_remembered_user', JSON.stringify({
                                username: username,
                                timestamp: new Date().toISOString()
                            }));
                        } else {
                            localStorage.removeItem('gw_remembered_user');
                        }

                        // Redirect to main app after short delay
                        setTimeout(() => {
                            window.location.href = 'gradewise-pro.html';
                        }, 1000);
                    } else {
                        showStatusMessage(result.message || 'Login failed. Please try again.', 'error');
                        
                        if (result.isLocked) {
                            loginButton.disabled = true;
                            setTimeout(() => {
                                loginButton.disabled = false;
                            }, result.lockoutDuration || 900000); // 15 minutes default
                        }
                    }
                } catch (error) {
                    console.error('Login error:', error);
                    showStatusMessage('An unexpected error occurred. Please try again.', 'error');
                } finally {
                    loginButton.classList.remove('loading');
                    loginButton.disabled = false;
                }
            });
        }

        function setupGoogleLogin() {
            const googleLoginButton = document.getElementById('google-login');
            
            googleLoginButton.addEventListener('click', async () => {
                try {
                    showStatusMessage('Redirecting to Google authentication...', 'success');
                    
                    // In a real implementation, this would redirect to Google OAuth
                    // For now, we'll simulate a successful Google login
                    setTimeout(async () => {
                        const result = await window.authManager.authenticateWithGoogle('mock_google_token');
                        
                        if (result.success) {
                            showStatusMessage('Google login successful! Redirecting...', 'success');
                            setTimeout(() => {
                                window.location.href = 'gradewise-pro.html';
                            }, 1000);
                        } else {
                            showStatusMessage('Google login failed. Please try again.', 'error');
                        }
                    }, 1500);
                } catch (error) {
                    console.error('Google login error:', error);
                    showStatusMessage('Google login failed. Please try again.', 'error');
                }
            });
        }

        function showError(fieldId, message) {
            const field = document.getElementById(fieldId);
            const errorElement = document.getElementById(`${fieldId}-error`);
            
            field.classList.add('error');
            errorElement.textContent = message;
            errorElement.classList.add('show');
        }

        function clearErrors() {
            document.querySelectorAll('.form-group input').forEach(input => {
                input.classList.remove('error');
            });
            document.querySelectorAll('.error-message').forEach(error => {
                error.classList.remove('show');
                error.textContent = '';
            });
        }

        function showStatusMessage(message, type) {
            const statusElement = document.getElementById('status-message');
            statusElement.textContent = message;
            statusElement.className = `status-message ${type}`;
        }

        function hideStatusMessage() {
            const statusElement = document.getElementById('status-message');
            statusElement.className = 'status-message';
        }

        // Handle forgot password
        document.querySelector('.forgot-password').addEventListener('click', (e) => {
            e.preventDefault();
            showStatusMessage('Password reset functionality coming soon. Contact administrator.', 'error');
        });

        // Handle contact administrator link
        document.querySelector('.login-footer a').addEventListener('click', (e) => {
            e.preventDefault();
            showStatusMessage('Contact your school administrator to create an account.', 'success');
        });
    </script>
</body>
</html>
