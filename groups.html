<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Explorer — New Testament Baptist Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #0f1117;
            --paper: #f7f4ef;
            --rule: #d4cfc5;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--paper);
            color: var(--ink);
            padding: 20px;
        }

        .group-card {
            background: white;
            border: 1px solid var(--rule);
            border-radius: 12px;
            padding: 20px;
            transition: 0.3s;
        }

        .group-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>

<body>

    <header class="max-w-6xl mx-auto mb-8 flex flex-col md:flex-row justify-between items-center gap-4">
        <div>
            <h1 class="text-3xl font-black text-blue-900 uppercase">Group Explorer</h1>
            <p class="text-gray-500">Create and manage student groups for assessment</p>
        </div>
        <div class="flex gap-3 w-full md:w-auto">
            <input type="text" id="group-search" oninput="filterGroups()" placeholder="Search groups..."
                class="border p-2 rounded-lg w-full md:w-64 outline-blue-600">
            <button onclick="createNewGroup()"
                class="bg-green-600 text-white px-4 py-2 rounded-lg font-bold text-sm flex items-center">+ New
                Group</button>
            <a href="gradewise-pro.html"
                class="bg-blue-600 text-white px-4 py-2 rounded-lg font-bold text-sm flex items-center">← Back to
                Editor</a>
        </div>
    </header>

    <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="groups-grid"></div>

    <script>
        const students = JSON.parse(localStorage.getItem('gw_students') || '[]');
        const groups = JSON.parse(localStorage.getItem('gw_groups') || '[]');

        function filterGroups () {
            const query = document.getElementById('group-search').value.toLowerCase();
            const cards = document.querySelectorAll('.group-card');
            cards.forEach(card => {
                const name = card.querySelector('h3').textContent.toLowerCase();
                card.style.display = name.includes(query) ? 'block' : 'none';
            });
        }

        function createNewGroup () {
            const groupName = prompt('Enter group name:');
            if (!groupName) return;

            const group = {
                id: Date.now().toString(),
                name: groupName,
                description: prompt('Enter group description (optional):') || '',
                students: [],
                createdAt: new Date().toISOString(),
                avg: 0
            };

            groups.push(group);
            localStorage.setItem('gw_groups', JSON.stringify(groups));
            init();
        }

        function deleteGroup (groupId) {
            if (!confirm('Are you sure you want to delete this group?')) return;

            const index = groups.findIndex(g => g.id === groupId);
            if (index > -1)
            {
                groups.splice(index, 1);
                localStorage.setItem('gw_groups', JSON.stringify(groups));
                init();
            }
        }

        function manageGroup (groupId) {
            const group = groups.find(g => g.id === groupId);
            if (!group) return;

            const availableStudents = students.filter(s => !group.students.includes(s.id));
            const studentOptions = availableStudents.map(s =>
                `<option value="${s.id}">${s.name} - ${s.class}</option>`
            ).join('');

            const currentStudents = group.students.map(studentId => {
                const student = students.find(s => s.id === studentId);
                return student ? `<li>${student.name} - ${student.class} <button onclick="removeStudentFromGroup('${groupId}', '${studentId}')" class="text-red-500 ml-2">×</button></li>` : '';
            }).join('');

            const modal = `
                <div id="group-modal" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:1000;">
                    <div style="background:white;padding:20px;border-radius:12px;max-width:500px;width:90%;max-height:80vh;overflow-y:auto;">
                        <h2 class="text-xl font-bold mb-4">Manage Group: ${group.name}</h2>
                        <p class="text-gray-600 mb-4">${group.description}</p>

                        <div class="mb-4">
                            <h3 class="font-semibold mb-2">Add Students:</h3>
                            <select id="student-select" class="w-full border p-2 rounded mb-2">
                                <option value="">Select student...</option>
                                ${studentOptions}
                            </select>
                            <button onclick="addStudentToGroup('${groupId}')" class="bg-blue-600 text-white px-4 py-2 rounded">Add</button>
                        </div>

                        <div class="mb-4">
                            <h3 class="font-semibold mb-2">Current Students (${group.students.length}):</h3>
                            <ul class="list-disc pl-5">${currentStudents || '<li class="text-gray-500">No students in this group</li>'}</ul>
                        </div>

                        <div class="flex gap-2">
                            <button onclick="closeGroupModal()" class="bg-gray-500 text-white px-4 py-2 rounded">Close</button>
                            <button onclick="deleteGroup('${groupId}')" class="bg-red-600 text-white px-4 py-2 rounded">Delete Group</button>
                        </div>
                    </div>
                </div>
            `;

            document.body.insertAdjacentHTML('beforeend', modal);
        }

        function addStudentToGroup (groupId) {
            const select = document.getElementById('student-select');
            const studentId = select.value;

            if (!studentId)
            {
                alert('Please select a student');
                return;
            }

            const group = groups.find(g => g.id === groupId);
            if (group && !group.students.includes(studentId))
            {
                group.students.push(studentId);
                updateGroupAverage(group);
                localStorage.setItem('gw_groups', JSON.stringify(groups));
                manageGroup(groupId);
            }
        }

        function removeStudentFromGroup (groupId, studentId) {
            const group = groups.find(g => g.id === groupId);
            if (group)
            {
                group.students = group.students.filter(id => id !== studentId);
                updateGroupAverage(group);
                localStorage.setItem('gw_groups', JSON.stringify(groups));
                manageGroup(groupId);
            }
        }

        function updateGroupAverage (group) {
            if (group.students.length === 0)
            {
                group.avg = 0;
                return;
            }

            const groupStudents = group.students.map(id => students.find(s => s.id === id)).filter(Boolean);
            const totalAvg = groupStudents.reduce((sum, student) => sum + (parseFloat(student.avg) || 0), 0);
            group.avg = (totalAvg / groupStudents.length).toFixed(1);
        }

        function closeGroupModal () {
            const modal = document.getElementById('group-modal');
            if (modal) modal.remove();
        }

        function init () {
            const grid = document.getElementById('groups-grid');
            const studentClasses = [...new Set(students.map(s => s.class))].filter(c => c);

            const classCards = studentClasses.map(cls => {
                const members = students.filter(s => s.class === cls);
                const avg = (members.reduce((a, b) => a + parseFloat(b.avg), 0) / members.length).toFixed(1);
                return `
                    <div class="group-card cursor-pointer" onclick="window.location.href='gradewise-pro.html?printGroup=${encodeURIComponent(cls)}'">
                        <div class="flex justify-between items-start mb-4">
                            <h3 class="text-xl font-black text-blue-900">${cls}</h3>
                            <span class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-xs font-bold">${members.length} Reports</span>
                        </div>
                        <p class="text-sm text-gray-500">Class Average: <span class="font-bold text-emerald-600">${avg}%</span></p>
                        <button class="mt-4 w-full py-2 border border-blue-600 text-blue-600 font-bold rounded-lg hover:bg-blue-600 hover:text-white transition">Print Batch</button>
                    </div>`;
            });

            const groupCards = groups.map(group => {
                updateGroupAverage(group);
                const memberCount = group.students.length;
                return `
                    <div class="group-card border-l-4 border-green-500">
                        <div class="flex justify-between items-start mb-4">
                            <h3 class="text-xl font-black text-green-900">${group.name}</h3>
                            <span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-xs font-bold">${memberCount} Students</span>
                        </div>
                        <p class="text-sm text-gray-600 mb-2">${group.description}</p>
                        <p class="text-sm text-gray-500">Group Average: <span class="font-bold text-emerald-600">${group.avg}%</span></p>
                        <div class="mt-4 flex gap-2">
                            <button onclick="manageGroup('${group.id}')" class="flex-1 py-2 bg-green-600 text-white font-bold rounded-lg hover:bg-green-700 transition">Manage</button>
                            <button onclick="window.location.href='gradewise-pro.html?printGroup=${encodeURIComponent(group.id)}'" class="flex-1 py-2 border border-green-600 text-green-600 font-bold rounded-lg hover:bg-green-600 hover:text-white transition">Print</button>
                        </div>
                    </div>`;
            });

            grid.innerHTML = classCards.concat(groupCards).join('');
        }

        init();
    </script>
</body>

</html>
